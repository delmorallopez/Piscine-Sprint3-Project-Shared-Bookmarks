<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Spaced Repetition Tracker</title>
        <script type="module" src="script.js"></script>
      </head>
  <body>
    <header>
      <h1>Shared Bookmarks Project</h1>
    <main>
        <!-- User Selection Dropdown -->
        <section>
            <label for="user-dropdown">Select a User:</label>
            <select id="user-dropdown" name="user-dropdown" size="1">
              <option>No user selected</option>
            </select>
          </section>

      <!--Main Content Area to display bookmarks and add new ones -->
      <div id="main-content" hidden>
        <section>
          <h2>List of Bookmarks</h2>
          <div id="bookmarks-display"></div>
        </section>
        
      <!-- Form to add new bookmarks -->
        <section>
          <h2>Add New Bookmarks</h2>
          <form id="add-bookmark-form">
            <div>
              <label for="new-url">New URL:</label>
              <input type="text" id="new-url" name="new-url" required style="margin-left: 8px;"/>
            </div>
            <div>
              <label for="new-title">Title:</label>
              <input type="text" id="new-title" name="new-title" required style="margin-left: 45px;"/>
            </div>
            <div>
              <label for="new-description">Description:</label>
              <input type="text" id="new-description" name="new-description" required />
            </div>
            <button type="submit">Add URL</button>
          </form>
        </section>
      </div>
    </main>
  </body>
</html>
