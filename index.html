<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Spaced Repetition Tracker</title>
        <script type="module" src="script.js"></script>

        <style>
          .bookmark-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 8px;
          }
          .bookmark-item a {
            color: blue;
            text-decoration: underline;
          }

          #add-bookmark-form {
            max-width: 400px;
            display: flex;
            flex-direction: column;
          }

           #add-bookmark-form div {
            margin-bottom: 1rem;
        }

          #add-bookmark-form input {
            height: 0.5rem;
            width: 70%;
            font-size: 0.8rem;
            padding: 0.5rem;
        }
          .button-group {
            display: flex;
            gap: 1rem; /* space between buttons */
            margin-top: 1rem; /* optional space above the buttons */
        }
          .button-group button {
            flex: 1; /* optional: make buttons same width */
            height: 2.5rem;
            font-size: 1rem;
            padding: 0.5rem;
       }    
        </style>

      </head>
  <body>
    <header>
      <h1>Shared Bookmarks Project</h1>
    <main>
        <!-- User Selection Dropdown -->
        <section>
            <label for="user-dropdown">Select a User:</label>
            <select id="user-dropdown" name="user-dropdown" size="1">
              <option>No user selected</option>
            </select>
          </section>

      <!--Main Content Area to display bookmarks and add new ones -->
      <div id="main-content" hidden>
        <section>
          <h2>List of Bookmarks</h2>
          <div id="bookmarks-display"></div>
        </section>
        
      <!-- Form to add new bookmarks -->
        <section>
          <h2>Add New Bookmarks</h2>
          <form id="add-bookmark-form">
            <div>
              <label for="new-url">New URL:</label>
              <input type="text" id="new-url" name="new-url" required style="margin-left: 10px;"/>
            </div>
            <div>
              <label for="new-title">Title:</label>
              <input type="text" id="new-title" name="new-title" required style="margin-left: 45px;"/>
            </div>
            <div>
              <label for="new-description">Description:</label>
              <input type="text" id="new-description" name="new-description" required /> 
            </div>
            <br />
            <div class="button-group">
              <button type="submit">Add Bookmark</button>
              <button id="delete-bookmarks-button" type="button">Delete Bookmark</button>
            </div>
          </form>
        </section>
      </div>
    </main>
  </body>
</html>
